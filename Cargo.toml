[package]
name = "rainmill-pdf"
version = "0.1.0"
description = "PDF documents for Laterite with Typst: markdown or Typst templates, letterhead layouts, a live preview, QR codes and barcodes, PDF/A and password protection"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rainmill/pdf-plugin"

# Marks this crate as a Laterite plugin and names the module it registers.
[package.metadata.laterite]
plugin = "rainmill.pdf"

[dependencies]
# Laterite crates are version-only; the building workspace patches them to the
# local checkout until Laterite publishes (see the location plugin's notes).
laterite-core = "0.10"
# The admin screens: template and layout resources, the preview and action routes.
laterite-admin = "0.10"
# Typst lays out and writes the PDF; typst-assets supplies its standard library's
# bundled fonts so a render needs nothing installed on the server.
typst = "0.15"
typst-pdf = "0.15"
# The compiled page-based document type `typst::compile` produces for the PDF.
typst-layout = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
# Markdown is parsed with the same parser the framework's renderer uses.
pulldown-cmark = { version = "0.13", default-features = false }
# A markdown template's `{{ variables }}`, the template language the framework's
# themes use.
minijinja = { version = "3", features = ["serde"] }
# Queries through the framework's portable layer (re-exports arrive with the
# framework's dependency hygiene slice).
sea-query = { version = "0.32", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Word-level diffs between saved versions on the History page.
similar = "2"
# QR codes and barcodes, drawn as SVG for the document to place.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
barcoders = { version = "2", features = ["svg"] }
# Password protection: AES-256 encryption of the finished PDF, which typst-pdf
# does not write itself; getrandom supplies the file key.
lopdf = { version = "0.47", default-features = false }
getrandom = "0.4"
# Logos, backgrounds and stored PDFs live in the media library.
laterite-media = "0.10"
# The theme function, component and public route that put PDFs on the site.
laterite-web = "0.10"
# A render compiles off the async runtime; media streams are read whole.
tokio = { version = "1", features = ["rt"] }
futures = "0.3"

[dev-dependencies]
laterite-core = { version = "0.10", features = ["sqlite", "postgres", "testing"] }
lopdf = { version = "0.47", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
laterite-auth = "0.10"
tower = { version = "0.5", features = ["util"] }

entity: pdf_templates
path: /templates
title: PDF templates
permission: rainmill.pdf.manage
list:
  creatable: true
  deletable: true
  order_by: title
  search: { prompt: Search templates }
  columns:
    title: { searchable: true }
    code: { searchable: true }
    format: { labels: [{ value: markdown, label: Markdown }, { value: typst, label: Typst }] }
    customized: { type: boolean, label: Customised }
    updated_at: { type: datetime, label: Updated }
form:
  title: Template
  timestamps: true
  actions:
    - { label: Download PDF, action: "rainmill/pdf/tools/templates/{id}/pdf", method: get }
    - { label: Duplicate, action: "rainmill/pdf/tools/templates/{id}/duplicate" }
    - { label: Reset to default, action: "rainmill/pdf/tools/templates/{id}/reset", confirm: 'Reset this template to the version its module ships? Your changes are lost.' }
  fields:
    title: { span: 1/2, rules: [required, { max_length: 160 }] }
    code: { span: 1/2, rules: [required, { max_length: 120 }], help: 'Dotted and permanent, such as acme.shop.invoice.' }
    format:
      span: 1/4
      type: select
      options: [{ value: markdown, label: Markdown }, { value: typst, label: Typst }]
    layout_id: { span: 1/4, type: reference, source: rainmill.pdf.layouts, label: Layout }
    paper: { span: 1/4, placeholder: From the layout }
    landscape: { type: switch, span: 1/4 }
    description: { type: textarea, rows: 2 }
    body:
      type: markdown
      preview: side
      preview_url: rainmill/pdf/tools/preview
      rows: 24
    sample_data:
      type: codeeditor
      language: json
      rows: 8
      label: Sample data
      help: 'A JSON object the preview renders with: {{ name }} in markdown, sys.inputs.name in Typst.'

entity: pdf_templates
path: /templates
title: Templates
permission: rainmill.pdf.manage
permissions: { create: rainmill.pdf.templates.create, update: rainmill.pdf.templates.update, delete: rainmill.pdf.templates.delete }
menu: { under: rainmill.pdf, order: 1 }
list:
  creatable: true
  deletable: true
  order_by: title
  search: { prompt: Search templates }
  columns:
    title: { searchable: true }
    code: { searchable: true }
    format: { labels: [{ value: markdown, label: Markdown }, { value: typst, label: Typst }] }
    customized: { type: boolean, label: Customised }
    updated_at: { type: datetime, label: Updated }
form:
  title: Template
  timestamps: true
  actions:
    - { label: History, action: "rainmill/pdf/tools/templates/{id}/history", method: get }
    - { label: Download PDF, action: "rainmill/pdf/tools/templates/{id}/pdf", method: get, permission: rainmill.pdf.preview }
    - { label: Duplicate, action: "rainmill/pdf/tools/templates/{id}/duplicate", permission: rainmill.pdf.templates.create }
    - { label: Reset to default, action: "rainmill/pdf/tools/templates/{id}/reset", confirm: 'Reset this template to the version its module ships? Your changes are lost.', permission: rainmill.pdf.templates.update }
  fields:
    title: { span: 1/2, rules: [required, { max_length: 160 }] }
    code: { span: 1/2, rules: [required, { max_length: 120 }], help: 'Dotted and permanent, such as acme.shop.invoice.' }
    format:
      span: 1/4
      type: select
      options: [{ value: markdown, label: Markdown }, { value: typst, label: Typst }]
    layout_id: { span: 1/4, type: reference, source: rainmill.pdf.layouts, label: Layout }
    paper: { span: 1/4, placeholder: From the layout }
    landscape: { type: switch, span: 1/4 }
    description: { type: textarea, rows: 2, span: 3/4, help: 'Also the PDF description.' }
    keywords: { span: 1/4, help: 'Comma separated, written into the PDF.' }
    body:
      type: markdown
      preview: side
      preview_url: rainmill/pdf/tools/preview
      rows: 24
    sample_data:
      type: codeeditor
      language: json
      rows: 8
      label: Sample data
      help: 'A JSON object the preview renders with: {{ name }} in markdown, sys.inputs.name in Typst. Codes: {{ qr(value) }} and {{ barcode(value, kind="ean13") }}; qr(value) and barcode(value) in Typst.'
relations:
  translations:
    label: Translation
    entity: pdf_template_translations
    foreign_key: template_id
    list:
      columns:
        locale: {}
        title: {}
        updated_at: { type: datetime, label: Updated }
    form:
      fields:
        locale: { span: 1/4, rules: [required, { max_length: 35 }], help: 'Such as de or pt-BR.' }
        title: { span: 3/4, help: 'Empty keeps the template title.' }
        body: { type: markdown, rows: 16, help: 'Same format as the template. Empty keeps the template body.' }
